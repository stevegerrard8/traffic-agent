<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" /><title>Dashboard – Crash Scope</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #2563eb; --dark: #0f172a; --light: #f1f5f9; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--light); display: flex; }
        .sidebar { width: 260px; background: var(--dark); color: white; padding: 2rem; height: 100vh; position: fixed; display: flex; flex-direction: column; }
        .sidebar a { color: #94a3b8; text-decoration: none; padding: 0.8rem 1rem; border-radius: 10px; margin-bottom: 0.5rem; display: block; }
        .sidebar a.active { background: rgba(255,255,255,0.1); color: white; }
        .content { margin-left: 260px; padding: 3rem; width: 100%; }
        .stat-card { background: white; padding: 1.5rem; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .chart-container { background: white; padding: 2rem; border-radius: 20px; margin-top: 2rem; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <h2 style="margin-bottom: 2rem;">Crash<span>Scope</span></h2>
        <nav>
            <a href="dashboard.html" class="active">🏠 Overview</a>
            <a href="blog.html">📝 Blog Insights</a>
            <a href="pricing.html">💳 Billing</a>
            <a href="index.html" style="margin-top: auto; color: #ef4444;">🚪 Logout</a>
        </nav>
    </aside>
    <main class="content">
        <h1>Risk Overview</h1>
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; margin-top: 2rem;">
            <div class="stat-card"><h4>Total Claims</h4><h2>1,245</h2></div>
            <div class="stat-card"><h4>Risk Score</h4><h2 style="color: #ef4444;">High</h2></div>
            <div class="stat-card"><h4>Prevention Rate</h4><h2 style="color: #10b981;">+14%</h2></div>
        </div>
        <div class="chart-container"><canvas id="riskChart"></canvas></div>
    </main>
    <script>
        const ctx = document.getElementById('riskChart').getContext('2d');
        new Chart(ctx, { type: 'line', data: { labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May'], datasets: [{ label: 'Accident Frequency', data: [65, 59, 80, 81, 56], borderColor: '#2563eb', tension: 0.4 }] } });
    </script>
</body>
</html>
