<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard – TrafficData</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #2563eb; --dark: #0f172a; --secondary: #64748b; --light: #f1f5f9; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--light); display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background: var(--dark); color: white; padding: 2rem; position: fixed; height: 100vh; }
        .sidebar h2 span { color: var(--primary); }
        .sidebar nav { margin-top: 3rem; display: flex; flex-direction: column; gap: 1rem; }
        .sidebar a { color: #94a3b8; text-decoration: none; padding: 0.8rem 1rem; border-radius: 10px; transition: 0.3s; }
        .sidebar a:hover, .sidebar a.active { background: rgba(255,255,255,0.1); color: white; }
        .content { margin-left: 260px; padding: 3rem; width: 100%; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin: 2rem 0; }
        .stat { background: white; padding: 1.5rem; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .stat span { display: block; color: var(--secondary); font-size: 0.9rem; margin-bottom: 0.5rem; }
        .stat strong { font-size: 1.5rem; color: var(--dark); }
        .chart-card { background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        @media (max-width: 768px) { .sidebar { display: none; } .content { margin-left: 0; } }
    </style>
</head>
<body>
    <aside class="sidebar">
        <h2>Traffic<span>Data</span></h2>
        <nav>
            <a href="#" class="active">Overview</a>
            <a href="#">Accidents</a>
            <a href="#">Regions</a>
            <a href="#">Export</a>
        </nav>
    </aside>
    <main class="content">
        <header style="display: flex; justify-content: space-between; align-items: center;">
            <h1>Accident Overview</h1>
            <div style="font-weight: 600;">Admin User ↓</div>
        </header>
        <div class="stats">
            <div class="stat"><span>🚗 Total Accidents</span><strong>124,532</strong></div>
            <div class="stat"><span>⚠️ Fatal</span><strong style="color: #ef4444;">3,218</strong></div>
            <div class="stat"><span>📈 YoY Change</span><strong style="color: #10b981;">-4.2%</strong></div>
        </div>
        <div class="chart-card">
            <h3 style="margin-bottom: 1.5rem;">Monthly Trends</h3>
            <canvas id="accidentChart" height="100"></canvas>
        </div>
    </main>
    <script>
        const ctx = document.getElementById('accidentChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
                datasets: [{ label: 'Accidents', data: [12000, 19000, 15000, 17000, 14000, 11000], borderColor: '#2563eb', tension: 0.4, fill: true, backgroundColor: 'rgba(37, 99, 235, 0.05)' }]
            },
            options: { responsive: true, plugins: { legend: { display: false } } }
        });
    </script>
</body>
</html>
