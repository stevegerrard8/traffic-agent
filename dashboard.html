<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard – Crash Scope</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #2563eb; --dark: #0f172a; --secondary: #64748b; --light: #f1f5f9; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--light); display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background: var(--dark); color: white; padding: 2rem; position: fixed; height: 100vh; display: flex; flex-direction: column; }
        .sidebar-logo { font-size: 1.5rem; font-weight: 700; text-decoration: none; color: white; margin-bottom: 3rem; }
        .sidebar-logo span { color: var(--primary); }
        .sidebar nav { display: flex; flex-direction: column; gap: 0.8rem; flex-grow: 1; }
        .sidebar a { color: #94a3b8; text-decoration: none; padding: 0.8rem 1rem; border-radius: 10px; transition: 0.3s; font-weight: 500; }
        .sidebar a:hover, .sidebar a.active { background: rgba(255,255,255,0.1); color: white; }
        .logout { margin-top: auto; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1rem; color: #ef4444 !important; }
        .content { margin-left: 260px; padding: 3rem; width: 100%; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2.5rem; }
        .stat { background: white; padding: 1.5rem; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .stat strong { font-size: 1.6rem; color: var(--dark); }
        .chart-card { background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        @media (max-width: 768px) { .sidebar { display: none; } .content { margin-left: 0; } }
    </style>
</head>
<body>
    <aside class="sidebar">
        <a href="index.html" class="sidebar-logo">Crash<span>Scope</span></a>
        <nav>
            <a href="#" class="active">🏠 Overview</a>
            <a href="#">🚗 Accidents</a>
            <a href="#">🗺️ Regions</a>
            <a href="pricing.html">💳 Pricing Plan</a>
            <a href="index.html" class="logout">🚪 Log Out</a>
        </nav>
    </aside>
    <main class="content">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h1>Dashboard Overview</h1>
            <div style="font-weight: 600; color: var(--secondary);">Admin User ↓</div>
        </header>
        <div class="stats">
            <div class="stat"><span>🚗 Total Cases</span><strong>124,532</strong></div>
            <div class="stat"><span>⚠️ Fatal</span><strong style="color: #ef4444;">3,218</strong></div>
            <div class="stat"><span>📈 YoY Change</span><strong style="color: #10b981;">-4.2%</strong></div>
        </div>
        <div class="chart-card"><h3>Intelligence Trend Analysis</h3><canvas id="accidentChart" height="100"></canvas></div>
    </main>
    <script>
        const ctx = document.getElementById('accidentChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
                datasets: [{ label: 'Cases', data: [12000, 19000, 15000, 17000, 14000, 11000], borderColor: '#2563eb', tension: 0.4, fill: true, backgroundColor: 'rgba(37, 99, 235, 0.05)' }]
            },
            options: { responsive: true, plugins: { legend: { display: false } } }
        });
    </script>
</body>
</html>
