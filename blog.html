<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" /><title>Blog – Crash Scope</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --dark: #0f172a; --light: #f8fafc; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--light); }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 8%; background: white; border-bottom: 1px solid #eee; position: fixed; width: 100%; top:0; z-index:100;}
        .container { padding: 10rem 8% 4rem; max-width: 1200px; margin: 0 auto; }
        .blog-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 2.5rem; }
        .card { background: white; border-radius: 20px; overflow: hidden; border: 1px solid #eee; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 20px 30px rgba(0,0,0,0.05); }
        .card-body { padding: 2rem; }
    </style>
</head>
<body>
    <header class="navbar">
        <a href="index.html" style="text-decoration:none; color:var(--dark); font-weight:800; font-size:1.5rem;">Crash<span>Scope</span></a>
        <nav style="display:flex; gap:2rem;">
            <a href="index.html" style="text-decoration:none; color:var(--dark);">Home</a>
            <a href="blog.html" style="color:var(--primary); text-decoration:none; font-weight:600;">Blog</a>
            <a href="dashboard.html" style="text-decoration:none; color:var(--dark);">Portal</a>
        </nav>
    </header>
    <div class="container">
        <h1 style="margin-bottom: 3rem; font-size: 3rem;">Industry Insights</h1>
        <div class="blog-grid">
            <div class="card"><div style="height:200px; background:#ddd; display:flex; align-items:center; justify-content:center; font-size:3rem;">📈</div><div class="card-body"><h3>Predictive Claims Analysis</h3><p>How AI is reshaping the insurance landscape in 2026.</p></div></div>
            <div class="card"><div style="height:200px; background:#ddd; display:flex; align-items:center; justify-content:center; font-size:3rem;">🛡️</div><div class="card-body"><h3>Fraud Prevention</h3><p>Detecting anomalies in regional accident data.</p></div></div>
        </div>
    </div>
</body>
</html>
